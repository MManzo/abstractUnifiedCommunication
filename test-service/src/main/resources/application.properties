# Set a different server port to avoid conflict with user-service if run simultaneously
server.port=8081

# RabbitMQ host configuration (shared by the framework)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672


# ===================================================================
# Dynamic Framework Configuration for OrderBusinessService
# ===================================================================

# --- Dynamic REST Endpoints for User Service ---
app.rest.endpoints.getUser.path=/api/v2/users/{id}
app.rest.endpoints.getUser.http-method=GET
app.rest.endpoints.getUser.service-bean-name=userBusinessService
app.rest.endpoints.getUser.dto-class-name=com.unifieddto.api.user.GetUserRequest
app.rest.endpoints.getUser.mappings.id=path:id

app.rest.endpoints.createUser.path=/api/v2/users
app.rest.endpoints.createUser.http-method=POST
app.rest.endpoints.createUser.service-bean-name=userBusinessService
# DTO class for POST is inferred from the first parameter of the 'execute' method

app.rest.endpoints.updateUser.path=/api/v2/users/{id}
app.rest.endpoints.updateUser.http-method=PUT
app.rest.endpoints.updateUser.service-bean-name=userBusinessService
app.rest.endpoints.updateUser.mappings.id=path:id # Map path variable to DTO field

app.rest.endpoints.deleteUser.path=/api/v2/users/{id}
app.rest.endpoints.deleteUser.http-method=DELETE
app.rest.endpoints.deleteUser.service-bean-name=userBusinessService
app.rest.endpoints.deleteUser.dto-class-name=com.unifieddto.api.user.DeleteUserRequest
app.rest.endpoints.deleteUser.mappings.id=path:id

app.rest.endpoints.searchUsers.path=/api/v2/users/search
app.rest.endpoints.searchUsers.http-method=GET
app.rest.endpoints.searchUsers.service-bean-name=userBusinessService
app.rest.endpoints.searchUsers.dto-class-name=com.unifieddto.api.user.SearchUsersRequest
app.rest.endpoints.searchUsers.mappings.email_query=query:email


# --- Dynamic RabbitMQ Listeners for User Service ---
app.rabbitmq.bindings.userCreateBinding.queue-name=user.commands.create
app.rabbitmq.bindings.userCreateBinding.exchange-name=user.commands.exchange
app.rabbitmq.bindings.userCreateBinding.routing-key=user.create
app.rabbitmq.bindings.userCreateBinding.service-bean-name=userBusinessService
app.rabbitmq.bindings.userCreateBinding.dto-class-name=com.unifieddto.api.user.CreateUserRequest

# (In a real app, you would add more bindings for update, delete etc.)


# --- Dynamic REST Endpoint for Order Service ---
app.rest.endpoints.createOrder.path=/api/v2/orders
app.rest.endpoints.createOrder.http-method=POST
app.rest.endpoints.createOrder.service-bean-name=orderBusinessService

# --- Dynamic RabbitMQ Listener for Order Service ---
app.rabbitmq.bindings.orderCreateBinding.queue-name=order.commands.create
app.rabbitmq.bindings.orderCreateBinding.exchange-name=order.commands.exchange
app.rabbitmq.bindings.orderCreateBinding.routing-key=order.create
app.rabbitmq.bindings.orderCreateBinding.service-bean-name=orderBusinessService
app.rabbitmq.bindings.orderCreateBinding.dto-class-name=com.unifieddto.api.order.CreateOrderRequest
