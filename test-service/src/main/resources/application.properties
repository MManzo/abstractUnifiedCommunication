# Set a different server port to avoid conflict with user-service if run simultaneously
server.port=8081

# RabbitMQ host configuration (shared by the framework)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672


# ===================================================================
# Dynamic Framework Configuration for OrderBusinessService
# ===================================================================

# --- Dynamic REST Endpoint ---
# Expose OrderBusinessService.execute(CreateOrderRequest) via REST
app.rest.endpoints.createOrder.path=/api/v2/orders
app.rest.endpoints.createOrder.http-method=POST
app.rest.endpoints.createOrder.service-bean-name=orderBusinessService


# --- Dynamic RabbitMQ Listener ---
# Expose OrderBusinessService.execute(CreateOrderRequest) via RabbitMQ
app.rabbitmq.bindings.orderCreateBinding.queue-name=order.commands.create
app.rabbitmq.bindings.orderCreateBinding.exchange-name=order.commands.exchange
app.rabbitmq.bindings.orderCreateBinding.routing-key=order.create
app.rabbitmq.bindings.orderCreateBinding.service-bean-name=orderBusinessService
app.rabbitmq.bindings.orderCreateBinding.dto-class-name=com.unifieddto.api.order.CreateOrderRequest
