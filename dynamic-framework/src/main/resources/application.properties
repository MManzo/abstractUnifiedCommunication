# Spring Boot App
spring.application.name=user-service

# gRPC Server Configuration
grpc.server.port=9090

# Enable gRPC reflection service, useful for debugging with tools like grpcurl
grpc.server.reflection-enabled=true

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=user-service-group
app.kafka.topic.users=users.topic

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

# ===================================================================
# Dynamic RabbitMQ Listener Configuration
# ===================================================================
# Define a binding named 'userCreateBinding'. We can add more bindings here.
app.rabbitmq.bindings.userCreateBinding.queue-name=user.commands.create
app.rabbitmq.bindings.userCreateBinding.exchange-name=user.commands.exchange
app.rabbitmq.bindings.userCreateBinding.routing-key=user.create
# Wire this binding to a service bean and a DTO class
app.rabbitmq.bindings.userCreateBinding.service-bean-name=userBusinessService
app.rabbitmq.bindings.userCreateBinding.dto-class-name=com.unifieddto.api.user.CreateUserRequest


# ===================================================================
# Dynamic REST Endpoint Configuration
# ===================================================================
# --- Endpoint 1: Get User By ID ---
app.rest.endpoints.getUser.path=/api/v2/users/{id}
app.rest.endpoints.getUser.http-method=GET
app.rest.endpoints.getUser.service-bean-name=userBusinessService
app.rest.endpoints.getUser.dto-class-name=com.unifieddto.api.user.GetUserRequest
# Field Mappings: <dtoFieldName>=<source>:<sourceName>
# 'source' can be 'path', 'query', or 'header'
app.rest.endpoints.getUser.mappings.id=path:id

# --- Endpoint 2: Create User ---
app.rest.endpoints.createUser.path=/api/v2/users
app.rest.endpoints.createUser.http-method=POST
app.rest.endpoints.createUser.service-bean-name=userBusinessService
# For POST/PUT, the DTO is inferred from the business service method signature.
# The request body is automatically deserialized to it.
